plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dotmini.threednurse'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.dotmini.threednurse'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePropsFile = rootProject.file('keystore.properties')
            def keystoreProps = new Properties()
            if (keystorePropsFile.exists()) {
                keystorePropsFile.withInputStream { keystoreProps.load(it) }
            }
            def releaseKeystore = file(keystoreProps.getProperty('storeFile', 'threednurse-release.keystore'))
            def releaseStorePassword = System.getenv('THREEDNURSE_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
            def releaseKeyAlias = System.getenv('THREEDNURSE_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
            def releaseKeyPassword = System.getenv('THREEDNURSE_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
            if (releaseKeystore.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!._*:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}
