<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Remove no-cache so browser can cache assets between visits -->
    <meta name="theme-color" content="#1e3a5f" />
    <title>3DNURSE Metaverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Splash screen shown instantly before React loads — gives immediate feedback -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #1e3a5f 0%, #be185d 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: 'Sarabun', system-ui, sans-serif;
        color: #fff; transition: opacity 0.5s ease;
      }
      #splash h1 { font-size: 2rem; font-weight: 900; margin: 0 0 0.5rem; letter-spacing: 2px; }
      #splash p  { font-size: 1rem; opacity: 0.8; margin: 0 0 1.5rem; }
      #splash-bar-wrap { width: 220px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; }
      #splash-bar { height: 100%; width: 0%; background: #fbcfe8; border-radius: 99px;
        animation: splash-anim 2.5s ease-out forwards; }
      @keyframes splash-anim { to { width: 90%; } }
      #splash.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Instant splash screen (shows before any JS executes) -->
    <div id="splash">
      <div style="font-size:3.5rem;margin-bottom:0.5rem">🏥</div>
      <h1>3DNURSE</h1>
      <p>Metaverse การพยาบาลมารดาและทารก</p>
      <div id="splash-bar-wrap"><div id="splash-bar"></div></div>
      <p style="font-size:0.75rem;margin-top:1rem;opacity:0.6">กำลังโหลด...</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hide splash once React has rendered -->
    <script>
      (function() {
        var splash = document.getElementById('splash');
        var observer = new MutationObserver(function() {
          if (document.getElementById('root').children.length > 0) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 600);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      })();
    </script>
  </body>
</html>
